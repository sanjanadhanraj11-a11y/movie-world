<!DOCTYPE html>
<html>
<head>
<title>Movie World</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #171717;
    color: white;
}

header {
    background: #e63946;
    padding: 20px;
    text-align: center;
}

.search {
    text-align: center;
    padding: 20px;
}

input {
    padding: 12px;
    width: 70%;
    border-radius: 8px;
    border: none;
}

.container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    padding: 20px;
}

.movie {
    background: #292929;
    width: 200px;
    padding: 15px;
    border-radius: 12px;
    text-align: center;
}

.movie img {
    width: 100%;
    height: 230px;
    object-fit: cover;
    border-radius: 8px;
}

button {
    background: #e63946;
    color: white;
    border: none;
    padding: 10px;
    border-radius: 6px;
    cursor: pointer;
}

footer {
    text-align: center;
    padding: 20px;
}
</style>
</head>

<body>

<header>
    <h1>🎬 MOVIE WORLD</h1>
    <p>Discover Your Favourite Movies</p>
</header>

<div class="search">
    <input type="text" id="search"
    placeholder="Search movies..."
    onkeyup="searchMovies()">
</div>

<div class="container" id="movies">

    <div class="movie">
        <img src="https://placehold.co/200x230/333/white?text=Movie+1">
        <h3>Romantic Love</h3>
        <p>Romance | 2025</p>
        <button onclick="addWatchlist('Romantic Love')">
        Add to Watchlist</button>
    </div>

    <div class="movie">
        <img src="https://placehold.co/200x230/444/white?text=Movie+2">
        <h3>Adventure World</h3>
        <p>Adventure | 2024</p>
        <button onclick="addWatchlist('Adventure World')">
        Add to Watchlist</button>
    </div>

    <div class="movie">
        <img src="https://placehold.co/200x230/555/white?text=Movie+3">
        <h3>Action Hero</h3>
        <p>Action | 2025</p>
        <button onclick="addWatchlist('Action Hero')">
        Add to Watchlist</button>
    </div>

</div>

<footer>
    <h3>My Movie World</h3>
    <p>Enjoy Your Movie Time!</p>
</footer>

<script>
function searchMovies() {
    let input = document.getElementById("search")
    .value.toLowerCase();

    let movies = document.getElementsByClassName("movie");

    for(let i = 0; i < movies.length; i++) {
        let name = movies[i].getElementsByTagName("h3")[0]
        .innerText.toLowerCase();

        movies[i].style.display =
        name.includes(input) ? "block" : "none";
    }
}

function addWatchlist(name) {
    alert(name + " added to your watchlist!");
}
</script>

</body>
</html>
